# Server configuration
server.port=${SERVER_PORT:9091}

# Spring Application Name
spring.application.name=files-postgre-mcp

# Spring AI MCP Server Properties
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=files-postgre-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.sse-endpoint=/mcp/sse
spring.ai.mcp.server.sse-message-endpoint=/mcp/message

# Default PostgreSQL Connection (Overridable via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/mcpdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
initialize-schema

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging settings
logging.level.root=INFO
logging.level.com.example.mcp=DEBUG
logging.level.org.springframework.ai=INFO
