# STDIO Mode Configuration for MCP Local Host integration (Claude Desktop / Cursor)
spring.ai.mcp.server.stdio=true
spring.main.banner-mode=off

# Redirect Spring Boot log output away from STDOUT to STDERR so JSON-RPC over STDOUT is not corrupted
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.output.ansi=NEVER
